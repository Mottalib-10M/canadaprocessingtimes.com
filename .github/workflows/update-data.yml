name: IRCC open data update and deploy

# Chaque lundi vers 9 h 30 (heure de l'Est) : le script relit les jeux de données ouverts d'IRCC et du SCT publiés
# sous la Licence du gouvernement ouvert du Canada (mises à jour mensuelles d'IRCC, résidents permanents, permis,
# Entrée express, normes de service) et réécrit src/data/ogl/. Une relecture hebdomadaire suffit : les jeux sont
# mensuels ou annuels. Puis le site est reconstruit et publié sur GitHub Pages.
on:
  schedule:
    - cron: "30 13 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Read IRCC open data (scheduled and manual runs)
        if: github.event_name != 'push'
        run: npm run update-data

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Commit the new readings
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/ogl/ src/data/site-config.ts
          git diff --cached --quiet || (git commit -m "Données ouvertes IRCC relues le $(date -u +%F)" && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
